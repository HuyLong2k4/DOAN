<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#222222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="540" fill="white"/>

  <!-- ===================== ĐƯỜNG NỐI (đều màu đen) ===================== -->
  <!-- Thao tác người dùng: nét liền -->
  <circle cx="40" cy="150" r="6" fill="#222222"/>
  <line x1="46" y1="150" x2="63" y2="150" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="215" y1="150" x2="393" y2="150" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="545" y1="150" x2="723" y2="150" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="895" y1="150" x2="1073" y2="150" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1295" y1="150" x2="1473" y2="150" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M470,120 C470,38 1555,38 1555,120" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M470,180 C470,246 140,246 140,180" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Tác vụ nền: nét đứt (cùng màu đen) -->
  <line x1="140" y1="180" x2="140" y2="378" stroke="#222222" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
  <line x1="810" y1="180" x2="810" y2="378" stroke="#222222" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
  <path d="M1185,180 C1185,256 1555,256 1555,182" fill="none" stroke="#222222" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow)"/>

  <!-- ===================== NHÃN CHUYỂN TRẠNG THÁI ===================== -->
  <g font-size="17" fill="#222222" text-anchor="middle">
    <text x="305" y="126">kết nối</text>
    <text x="305" y="145">+ chọn cách nhận</text>
    <text x="635" y="126">lấy hàng</text>
    <text x="635" y="145">(nhập mã)</text>
    <text x="985" y="142">báo đã giao</text>
    <text x="1385" y="126">người nhận</text>
    <text x="1385" y="145">xác nhận</text>
    <text x="1012" y="32">tự lấy (nhập mã)</text>
    <text x="305" y="263">rút / giải phóng (30')</text>
  </g>
  <g font-size="17" fill="#222222" font-style="italic">
    <text x="152" y="274" text-anchor="start">quá hạn</text>
    <text x="152" y="293" text-anchor="start">sử dụng</text>
    <text x="822" y="274" text-anchor="start">không đến</text>
    <text x="822" y="293" text-anchor="start">(6h)</text>
    <text x="1370" y="276" text-anchor="middle">tự xác nhận (24h)</text>
  </g>

  <!-- ===================== Ô TRẠNG THÁI (màu xám) ===================== -->
  <rect x="65" y="120" width="150" height="60" rx="10" fill="#e8e8e8" stroke="#555555" stroke-width="2"/>
  <text x="140" y="158" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PENDING</text>

  <rect x="395" y="120" width="150" height="60" rx="10" fill="#e8e8e8" stroke="#555555" stroke-width="2"/>
  <text x="470" y="158" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ACCEPTED</text>

  <rect x="725" y="120" width="170" height="60" rx="10" fill="#e8e8e8" stroke="#555555" stroke-width="2"/>
  <text x="810" y="158" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ON_THE_WAY</text>

  <rect x="1075" y="118" width="220" height="64" rx="10" fill="#e8e8e8" stroke="#555555" stroke-width="2"/>
  <text x="1185" y="144" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AWAITING_</text>
  <text x="1185" y="167" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CONFIRMATION</text>

  <!-- COMPLETED (trạng thái kết thúc, viền đôi) -->
  <rect x="1475" y="120" width="160" height="60" rx="10" fill="#dcdcdc" stroke="#555555" stroke-width="2"/>
  <rect x="1480" y="125" width="150" height="50" rx="7" fill="none" stroke="#555555" stroke-width="2"/>
  <text x="1555" y="158" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">COMPLETED</text>

  <rect x="65" y="380" width="150" height="60" rx="10" fill="#cfcfcf" stroke="#555555" stroke-width="2"/>
  <text x="140" y="418" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">EXPIRED</text>

  <rect x="725" y="380" width="170" height="60" rx="10" fill="#cfcfcf" stroke="#555555" stroke-width="2"/>
  <text x="810" y="418" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CANCELLED</text>

  <!-- ===================== CHÚ THÍCH ===================== -->
  <line x1="300" y1="470" x2="360" y2="470" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="372" y="476" font-size="18" fill="#222222">thao tác người dùng (nét liền)</text>
  <line x1="300" y1="502" x2="360" y2="502" stroke="#222222" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
  <text x="372" y="508" font-size="18" fill="#222222">tác vụ nền / cron (nét đứt)</text>
</svg>
